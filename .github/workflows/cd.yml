name: CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: Full CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: aeroguard-api
            dockerfile: Dockerfile
            port: 8000
            health: /health
          - image: aeroguard-dashboard
            dockerfile: Dockerfile.dashboard
            port: 8501
            health: /_stcore/health
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: smoke/${{ matrix.image }}:test
          build-args: AEROGUARD_VERSION=${{ steps.meta.outputs.version }}

      - name: Smoke test
        env:
          IMAGE: smoke/${{ matrix.image }}:test
          PORT: ${{ matrix.port }}
          HEALTH: ${{ matrix.health }}
        run: |
          docker run -d --name smoke -p "$PORT:$PORT" "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT$HEALTH"; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AEROGUARD_VERSION=${{ steps.meta.outputs.version }}

  deploy:
    name: Deploy API to Render
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aeroguard-api-75tq.onrender.com
    env:
      API_URL: https://aeroguard-api-75tq.onrender.com
      TAG: ${{ github.ref_name }}
    steps:
      - name: Trigger the deploy hook with the new image
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          VERSION="${TAG#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/$OWNER/aeroguard-api:$VERSION"
          ENCODED=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE")
          curl -fsS --retry 3 --retry-all-errors --retry-delay 10 -X POST "$DEPLOY_HOOK&imgURL=$ENCODED" > /dev/null
          echo "Deploy requested for $IMAGE"

      - name: Smoke test on the public URL
        run: |
          VERSION="${TAG#v}"
          for _ in $(seq 1 60); do
            if curl -fsS "$API_URL/health" | grep -q "\"version\":\"$VERSION\""; then
              curl -fsS --retry 3 --retry-all-errors --retry-delay 10 "$API_URL/flotte/moteurs"
              echo
              echo "Render serves $VERSION and its models are reachable."
              exit 0
            fi
            sleep 10
          done
          echo "Render did not serve $VERSION within 10 minutes."
          exit 1

  release:
    name: GitHub release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
