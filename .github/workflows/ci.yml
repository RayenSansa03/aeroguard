name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src tests scripts dashboard
      - run: ruff format --check src tests scripts dashboard

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install -e .
      - run: pytest --cov=aeroguard --cov-report=xml
      - name: Envoyer la couverture à Codecov (une seule fois)
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-api.txt -r requirements-dashboard.txt

  docker:
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aeroguard-api
            dockerfile: Dockerfile
            port: 8000
            sante: /health
          - image: aeroguard-dashboard
            dockerfile: Dockerfile.dashboard
            port: 8501
            sante: /_stcore/health
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }}:ci .

      - name: Smoke test (le service répond sur sa route de santé)
        run: |
          docker run -d --name smoke -p ${{ matrix.port }}:${{ matrix.port }} ${{ matrix.image }}:ci
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${{ matrix.port }}${{ matrix.sante }}"; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Scan Trivy (vulnérabilités HIGH et CRITICAL qui ont un correctif)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ matrix.image }}:ci
          version: v0.69.3
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
